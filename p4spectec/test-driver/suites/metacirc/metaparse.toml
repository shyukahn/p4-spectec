# Meta codec round trips: `metaparse` (make test-metacirc-metaparse).
#
# Each suite converts its `spec` sources, then requires the AL
# meta encoding to be a fixed point of decode-then-encode.
# Paths are relative to the repository root.

[[suites]]
name = "spec"
spec = ["spec"]

[[suites]]
name = "spec-meta"
spec = ["spec-meta"]
