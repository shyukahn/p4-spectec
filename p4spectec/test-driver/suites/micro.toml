# Micro tests: `micro <config>` (make test-run-st runs sl).
#
# Each suite gives every .watsup source under `root` one verdict at `stage`:
# outcome "success" passes every stage up to `stage`,
# outcome "failure" passes every earlier stage and fails at `stage`.
# The run stage evaluates the source's relation `Main`, whose notation is `OK`,
# or, for a suite with `entry = "func"`, its function `$main`.
#
# A configuration runs its `stages` in order and skips suites whose `stage`
# is not among them; the last conversion stage picks the interpreter language.
# `excludes` lists directories of .exclude files naming sources to skip.
# Paths are relative to the repository root.

[[configs]]
name = "sl"
cache = true
det = true
stages = ["parse", "elab", "algo", "structure", "run"]
excludes = []

[[suites]]
name = "spec-meta-rel-succ"
root = "testdata/spec-meta/rel/succ"
outcome = "success"
stage = "run"

[[suites]]
name = "spec-meta-rel-err"
root = "testdata/spec-meta/rel/err"
outcome = "failure"
stage = "run"

[[suites]]
name = "spec-meta-func-succ"
root = "testdata/spec-meta/func/succ"
outcome = "success"
stage = "run"
entry = "func"
